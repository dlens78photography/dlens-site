<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLens Photography & Videography – Coming soon</title>
<meta name="description" content="DLens Photography & Videography, Bengaluru. Weddings, events, portraits and brands. Your Story. Our Lens. Website coming soon.">
<meta property="og:title" content="DLens Photography & Videography">
<meta property="og:description" content="Your Story. Our Lens. Website coming soon.">
<meta property="og:image" content="/logo.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0A0A0A;color:#F2F2F2;font-family:Inter,system-ui,sans-serif}
  main{min-height:100vh;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .logo{width:140px;height:140px;border-radius:50%;display:block}
  .name{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:44px;color:#E3C273;line-height:1}
  .gold{color:#E3C273}
  .sub{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#9A9A9A}
  h1{margin:18px 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(40px,6vw,72px);line-height:1.05;letter-spacing:0}
  .tag{margin:0;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:20px;color:#E3C273}
  .btn{margin-top:8px;text-decoration:none;background:#E3C273;color:#0A0A0A;font-weight:700;padding:14px 24px;border-radius:999px}
  .btn:hover{background:#F2F2F2}
  .place{text-decoration:none;line-height:1.5;margin-top:12px;font-size:14px;color:#9A9A9A}
  .place:hover{color:#E3C273}
  .credit{font-size:13px;color:#8A8A8A}
  .lines-bg{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
  .veil{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 55% 60% at 50% 50%,rgba(10,10,10,.85) 0%,rgba(10,10,10,.4) 60%,rgba(10,10,10,0) 100%)}
  main{position:relative;z-index:1}
</style>
</head>
<body>
<canvas class="lines-bg" id="lines" aria-hidden="true"></canvas>
<div class="veil"></div>
<main>
  <img class="logo" src="/logo.png" alt="DLens logo" width="140" height="140">
  <div class="name">DLens</div>
  <div class="sub">Photography &amp; Videography</div>
  <h1>Coming soon</h1>
  <p class="tag">Your Story. Our Lens.</p>
  <a class="btn" href="https://instagram.com/dlens6photography" target="_blank" rel="noopener">Instagram · @dlens6photography</a>
  <a class="place" href="https://www.google.com/maps/search/?api=1&amp;query=Church+Street+Near+Pollution+Board+Bengaluru+560001" target="_blank" rel="noopener">Church Street, Near Pollution Board, Bengaluru – 560001</a>
  <div class="credit">Designed by NoviraVisuals</div>
</main>
<script>
(function () {
  const canvas = document.getElementById('lines');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINES = 8;
  const SPEED = 0.00025;
  const COLORS = ['#E3C273', '#B8923F', '#F2E6C8'];
  let w, h, dpr, small;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; small = w < 700;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) draw(0);
  }
  const lines = Array.from({ length: LINES }, (_, i) => ({
    offset: i / LINES,
    phase: Math.random() * Math.PI * 2,
    amp: 0.06 + Math.random() * 0.14,
    color: COLORS[i % COLORS.length],
    width: 0.6 + Math.random() * 1.2,
    alpha: 0.18 + Math.random() * 0.17
  }));
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lines) {
      const p = t * SPEED + l.phase;
      const y0 = h * (0.12 + l.offset * 0.8);
      const a = h * l.amp;
      ctx.beginPath();
      ctx.moveTo(-20, y0 + Math.sin(p) * a);
      ctx.bezierCurveTo(w * 0.30, y0 + Math.cos(p * 1.3) * a * 1.6,
                        w * 0.65, y0 - Math.sin(p * 0.9) * a * 1.6,
                        w + 20, y0 + Math.cos(p) * a);
      const g = ctx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.3, l.color);
      g.addColorStop(0.7, l.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = g;
      ctx.globalAlpha = l.alpha;
      ctx.lineWidth = l.width;
      ctx.shadowColor = l.color;
      ctx.shadowBlur = small ? 0 : 8;
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  addEventListener('resize', resize); resize();
  if (reduce) return;
  let raf;
  function loop(t) { draw(t); raf = requestAnimationFrame(loop); }
  raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
