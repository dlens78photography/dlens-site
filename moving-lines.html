<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving Lines</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0630; }
  /* Drop .lines-bg into any section: it fills its nearest positioned parent */
  .hero { position: relative; min-height: 100%; overflow: hidden;
          background: linear-gradient(100deg, #1a0f8f 0%, #2a0f9e 45%, #0a0630 100%); }
  .lines-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .hero-content { position: relative; z-index: 1; color: #fff; font: 600 clamp(2rem, 6vw, 4rem)/1.1 system-ui, sans-serif;
                  display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 0 1rem; }
</style>
</head>
<body>
<section class="hero">
  <canvas class="lines-bg" id="lines"></canvas>
  <div class="hero-content">Your headline here</div>
</section>

<script>
(function () {
  const canvas = document.getElementById('lines');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Tweak these
  const LINES = 14;          // number of curves
  const SPEED = 0.00035;     // animation speed
  const COLORS = ['#ff4fd8', '#b24bff', '#7a6bff', '#ffffff']; // magenta, violet, blue, white accent

  let w, h, dpr;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    w = r.width; h = r.height;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const lines = Array.from({ length: LINES }, (_, i) => ({
    offset: i / LINES,
    phase: Math.random() * Math.PI * 2,
    amp: 0.08 + Math.random() * 0.18,
    color: COLORS[i % COLORS.length === 3 && Math.random() > 0.3 ? 0 : i % COLORS.length],
    width: 0.6 + Math.random() * 1.6,
    alpha: 0.25 + Math.random() * 0.5
  }));

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lines) {
      const p = t * SPEED + l.phase;
      const y0 = h * (0.2 + l.offset * 0.7);
      const a = h * l.amp;
      ctx.beginPath();
      ctx.moveTo(-20, y0 + Math.sin(p) * a);
      ctx.bezierCurveTo(
        w * 0.30, y0 + Math.cos(p * 1.3) * a * 1.6,
        w * 0.65, y0 - Math.sin(p * 0.9) * a * 1.6,
        w + 20,   y0 + Math.cos(p) * a
      );
      const g = ctx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.35, l.color);
      g.addColorStop(0.75, l.color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g;
      ctx.globalAlpha = l.alpha;
      ctx.lineWidth = l.width;
      ctx.shadowColor = l.color;
      ctx.shadowBlur = 12;
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  if (reduce) { draw(0); return; }
  let raf;
  function loop(t) { draw(t); raf = requestAnimationFrame(loop); }
  raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
